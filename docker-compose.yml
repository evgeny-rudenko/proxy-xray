services:
  proxy-xray:
    build: .
    image: proxy-xray:local
    container_name: proxy-xray
    restart: unless-stopped
    command:
      - --sub-url
      - "${XRAY_SUB_URL:?set XRAY_SUB_URL in .env}"
      - --extra-file
      - /opt/proxy-xray/vless-extra.txt
      - --inbound-vless
      - --inbound-vless-id
      - "${INBOUND_VLESS_ID:?set INBOUND_VLESS_ID in .env}"
      - --state-file
      - /var/lib/proxy-xray/state.json
    environment:
      TZ: "${TZ:-Europe/Moscow}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    ports:
      - "0.0.0.0:1080:1080"
      - "0.0.0.0:8123:8123"
      - "0.0.0.0:10086:10086"
      - "0.0.0.0:18080:18080"
    volumes:
      - ./vless-extra.txt:/opt/proxy-xray/vless-extra.txt:ro
      # Directory mount permits atomic replace; private state contains cached credentials.
      - ./runtime/chain:/var/lib/proxy-xray
      - ./assets:/opt/proxy-xray/assets
